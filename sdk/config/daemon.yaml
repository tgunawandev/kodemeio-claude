# =============================================================================
# KodeClaw Daemon Configuration
# =============================================================================
# Hot-reloaded every 30 seconds — no restart needed after changes.

timezone: Asia/Jakarta
security_level: moderate

quiet_hours:
  - start: "23:00"
    end: "06:00"

# ─── Persona ──────────────────────────────────────────────────────────
persona:
  enabled: true
  # identity_file and soul_file auto-resolved to IDENTITY.md/SOUL.md in config dir

# ─── Heartbeat ────────────────────────────────────────────────────────
heartbeat:
  enabled: true
  default_interval_minutes: 30
  workspaces:
    kodemeio:
      interval_minutes: 30
      forward_to_telegram: true
    kontenos:
      interval_minutes: 60
    journaltx:
      interval_minutes: 60
    kidneuro:
      enabled: false
    infra:
      interval_minutes: 120
    core:
      enabled: false

# ─── Cron ─────────────────────────────────────────────────────────────
cron:
  enabled: true

# ─── Telegram ─────────────────────────────────────────────────────────
telegram:
  enabled: false
  token_env: TELEGRAM_BOT_TOKEN
  default_workspace: kodemeio
  allowed_user_ids: []
  forward_heartbeat: true
  forward_cron: false
  react_on_receive: "👀"
  react_on_complete: "✅"
  react_on_error: "❌"

# ─── Voice ────────────────────────────────────────────────────────────
voice:
  # STT cascade: groq → openai → local (auto-detected from env vars)
  stt_providers: []
  # TTS: send voice notes back for voice messages
  tts_enabled: false
  tts_provider: openai
  tts_model: tts-1
  tts_voice: onyx
  voice_back_triggers:
    - "read this"
    - "tell me"
    - "say it"

# ─── Dashboard ────────────────────────────────────────────────────────
dashboard:
  enabled: true

# ─── Session ──────────────────────────────────────────────────────────
session:
  max_turns_before_compact: 25
  compaction_prompt: >-
    Summarize our conversation context so far in bullet points,
    then continue with fresh context.
  timeout_minutes: 5
