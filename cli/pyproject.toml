[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-claude"
version = "0.1.0"
description = "Kodemeio Claude Code CLI — manage local and remote Claude Code environments"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kodemeio", email = "dev@kodeme.io" }]
keywords = ["claude-code", "cli", "kodemeio", "devtools"]
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "kctl-common>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
]

[project.scripts]
kctl-claude = "kctl_claude.cli:_run"

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_claude"]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
