<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KodeClaw Dashboard</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6; --purple: #a855f7; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0; color: var(--blue); }
    h2 { font-size: 0.85rem; margin: 1.5rem 0 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.75rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem 1rem; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 0.2rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .stat:last-child { border: none; }
    .stat-label { color: var(--muted); }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 0.2rem; font-size: 0.7rem; font-weight: 600; }
    .badge-on { background: #166534; color: var(--green); }
    .badge-off { background: #7f1d1d; color: var(--red); }
    .badge-active { background: #1e3a5f; color: var(--blue); }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: normal; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
    .status-success { color: var(--green); }
    .status-failure { color: var(--red); }
    .status-timeout { color: var(--yellow); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .header-right { text-align: right; }
    .uptime { color: var(--muted); font-size: 0.75rem; }
    .persona { color: var(--purple); font-size: 0.85rem; }
    .refresh-bar { color: var(--muted); font-size: 0.7rem; text-align: right; margin-top: 1rem; }
    .btn { background: var(--border); color: var(--text); border: none; padding: 0.2rem 0.5rem; border-radius: 0.2rem; font-size: 0.7rem; cursor: pointer; font-family: inherit; }
    .btn:hover { background: var(--blue); }
    .job-row { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .job-row:last-child { border: none; }
    .job-name { color: var(--text); font-weight: 600; }
    .job-schedule { color: var(--muted); font-size: 0.75rem; }
    .job-workspace { color: var(--blue); font-size: 0.75rem; }
    .section { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 id="title">KodeClaw Dashboard</h1>
    </div>
    <div class="header-right">
      <div class="persona" id="persona"></div>
      <div class="uptime" id="uptime"></div>
    </div>
  </div>

  <h2>Subsystems</h2>
  <div class="grid section" id="subsystems"></div>

  <h2>Workspaces</h2>
  <div class="grid section" id="sessions"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div>
      <h2>Queue</h2>
      <div class="card section" id="queue"></div>
    </div>
    <div>
      <h2>Cron Jobs</h2>
      <div class="card section" id="jobs"></div>
    </div>
  </div>

  <h2>Recent Runs</h2>
  <div class="card section">
    <table>
      <thead><tr><th>Time</th><th>Source</th><th>Workspace</th><th>Prompt</th><th>Status</th><th>Duration</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </div>

  <div class="refresh-bar" id="refresh"></div>

  <script>
    const API = '/dashboard/api';

    async function refresh() {
      try {
        const res = await fetch(`${API}/status`);
        const d = await res.json();
        renderPersona(d.persona);
        renderSubsystems(d.subsystems);
        renderSessions(d.sessions);
        renderQueue(d);
        renderJobs(d.jobs || []);
        renderHistory(d.recent_runs || []);
        renderUptime(d.started_at);
        document.getElementById('refresh').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('refresh').textContent = `Error: ${e.message}`;
      }
    }

    function renderPersona(p) {
      const el = document.getElementById('persona');
      if (p) {
        el.textContent = `${p.emoji} ${p.name}`;
        document.getElementById('title').textContent = `${p.emoji} ${p.name} Dashboard`;
      }
    }

    function renderSubsystems(s) {
      document.getElementById('subsystems').innerHTML = Object.entries(s).map(([k,v]) =>
        `<div class="card"><div class="stat"><span class="stat-label">${k}</span><span class="badge ${v?'badge-on':'badge-off'}">${v?'ON':'OFF'}</span></div></div>`
      ).join('');
    }

    function renderSessions(sessions) {
      document.getElementById('sessions').innerHTML = Object.entries(sessions).map(([ws,sid]) =>
        `<div class="card"><div class="stat"><span class="stat-label">${ws}</span><span class="badge ${sid?'badge-active':'badge-off'}">${sid?sid.slice(0,8)+'...':'idle'}</span></div></div>`
      ).join('') || '<div class="card"><span class="stat-label">No sessions</span></div>';
    }

    function renderQueue(d) {
      document.getElementById('queue').innerHTML =
        `<div class="stat"><span class="stat-label">Pending</span><span>${d.queue_depth}</span></div>`+
        `<div class="stat"><span class="stat-label">Running</span><span>${d.in_flight}</span></div>`;
    }

    function renderJobs(jobs) {
      const el = document.getElementById('jobs');
      if (!jobs.length) { el.innerHTML = '<span class="stat-label" style="font-size:0.8rem">No jobs configured</span>'; return; }
      el.innerHTML = jobs.map(j =>
        `<div class="job-row">
          <div>
            <span class="badge ${j.enabled?'badge-on':'badge-off'}">${j.enabled?'ON':'OFF'}</span>
            <span class="job-name">${j.name}</span>
            <span class="job-workspace">${j.workspace}</span>
          </div>
          <span class="job-schedule">${j.schedule}</span>
        </div>`
      ).join('');
    }

    function renderHistory(runs) {
      const el = document.getElementById('history');
      if (!runs.length) { el.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">No runs yet</td></tr>'; return; }
      el.innerHTML = runs.slice(0,30).map(r =>
        `<tr>
          <td>${new Date(r.started_at).toLocaleTimeString()}</td>
          <td>${r.source}</td>
          <td>${r.workspace}</td>
          <td style="color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.prompt_preview||'-'}</td>
          <td class="status-${r.status}">${r.status}</td>
          <td>${(r.duration_ms/1000).toFixed(1)}s</td>
        </tr>`
      ).join('');
    }

    function renderUptime(s) {
      if (!s) return;
      const ms = Date.now()-new Date(s).getTime();
      const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
      document.getElementById('uptime').textContent = `Uptime: ${h}h ${m}m`;
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
