services:
  claude-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kodemeio-claude:dev
    container_name: kodemeio-claude-dev
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-Tri Gunawan}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-tri@kodeme.io}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENABLE_SDK_API: ${ENABLE_SDK_API:-true}
      SDK_API_KEY: ${SDK_API_KEY:-dev-key}
      ENABLE_DAEMON: ${ENABLE_DAEMON:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: Asia/Jakarta
    volumes:
      # Mount current directory for development
      - .:/opt/dev/kodemeio-claude
      # Persistent state
      - claude-config:/home/dev/.claude
      - claude-history:/commandhistory
    ports:
      - "3100:3100"
    stdin_open: true
    tty: true

volumes:
  claude-config:
  claude-history:
