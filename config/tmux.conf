# =============================================================================
# tmux.conf — kodemeio-claude multi-company development
# =============================================================================

# Prefix: Ctrl+A (more ergonomic than Ctrl+B)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Modern terminal settings
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Quick session switching (company shortcuts)
bind k switch-client -t kodemeio
bind o switch-client -t kontenos
bind j switch-client -t journaltx
bind n switch-client -t kidneuro
bind i switch-client -t infra
bind c switch-client -t core

# Status bar
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S #[default]| "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%H:%M %Z #[fg=#f38ba8]#H"
set -g status-right-length 40

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
